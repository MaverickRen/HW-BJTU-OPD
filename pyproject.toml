[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-bjtu-opd"
version = "0.1.0"
description = "Reproducible Qwen3.5 multimodal SFT, Vision-OPD and four-benchmark evaluation workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "HW_BJTU_OPD"}]
dependencies = [
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "Pillow==12.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
