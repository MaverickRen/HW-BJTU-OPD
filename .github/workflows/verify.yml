name: verify

on:
  push:
  pull_request:

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_repo.py
      - run: pytest
      - run: >-
          ruff check
          scripts/evaluate.py scripts/preflight.py scripts/prepare_vstar.py
          scripts/prepare_opd_release.py src/hw_bjtu_opd/eval
          tests/test_eval_cli.py tests/test_opd_release.py tests/test_results.py
      - run: >-
          ruff format --check
          scripts/evaluate.py scripts/preflight.py scripts/prepare_vstar.py
          scripts/prepare_opd_release.py src/hw_bjtu_opd/eval
          tests/test_eval_cli.py tests/test_opd_release.py tests/test_results.py
      - run: >-
          bash -n scripts/install_eval.sh scripts/evaluate_vstar.sh
          scripts/bootstrap.sh scripts/export_opd_checkpoint.sh
